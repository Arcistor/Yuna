[package]
name = "yuna"
version = "0.1.0"
edition = "2021"

[lib]
name = "yuna"
path = "src/lib.rs"

[[bin]]
name = "yuna"
path = "src/bin/yuna.rs"

[[bin]]
name = "yunactl"
path = "src/bin/yunactl.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
notify = "6"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
